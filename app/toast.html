<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shroom toast</title>
    <style>
      /* The marker toast (N78; the canvas's MarkerToast board): the agent label's pill with the
         marker's flag, at the panel's top right inside its margin (overlay.rs TOAST_MARGIN:
         16 right, 12 above, 20 below) — its words, then its quieter hint. The panel takes no
         clicks and the page is clear around the pill. The pill casts its own shadow, the
         board's, so the shadow fades with it: macOS's would be cast once, from whatever the
         panel held then. It fades in, stays, and fades out over its two seconds; a new press
         starts them again. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; -webkit-user-select: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      main { height: 100%; box-sizing: border-box; padding: 12px 16px 20px 0; display: flex; justify-content: flex-end; align-items: flex-start; }
      .pill { display: flex; align-items: center; gap: 8px; height: 30px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 15px; background: rgba(46, 52, 64, 0.9); border: 1px solid rgba(236, 239, 244, 0.14); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); white-space: nowrap; }
      .pill[hidden] { display: none; }
      .pill.on { animation: toast 2s linear forwards; }
      @keyframes toast { 0% { opacity: 0; } 6% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
      svg { width: 10px; height: 12px; display: block; flex: none; }
      #line { font-size: 12.5px; font-weight: 600; color: #eceff4; }
      #hint { font-size: 12px; color: #aeb6c4; }
    </style>
  </head>
  <body>
    <main>
      <div class="pill" id="pill" hidden>
        <svg viewBox="0 0 10 12" aria-hidden="true"><path d="M1 0v12M1 1h8l-2 3 2 3H1z" fill="#88c0d0" stroke="#88c0d0" stroke-width="1.2"></path></svg>
        <span id="line"></span>
        <span id="hint"></span>
      </div>
    </main>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
