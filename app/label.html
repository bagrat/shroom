<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shroom label</title>
    <style>
      /* The agent label (N62, B216; the canvas's CliAgentLabel board): a small dark pill at the
         panel's right edge — shroom's mushroom with the tray's red dot, then its line. The
         panel takes no clicks and the page is clear around the pill; macOS casts its shadow. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; -webkit-user-select: none; user-select: none; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      main { height: 100%; display: flex; justify-content: flex-end; align-items: center; }
      .pill { display: flex; align-items: center; gap: 7px; height: 26px; box-sizing: border-box; padding: 0 11px 0 8px; border-radius: 13px; background: rgba(46, 52, 64, 0.88); border: 1px solid rgba(236, 239, 244, 0.14); color: #eceff4; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
      .pill[hidden] { display: none; }
      svg { width: 15px; height: 15px; display: block; flex: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="pill" id="pill" hidden>
        <svg viewBox="18 20 90 90" aria-hidden="true">
          <path d="M50,68 C49,82 46,92 46,96 C46,101 52,104 60,104 C68,104 74,101 74,96 C74,92 71,82 70,68 Z" fill="#E5E9F0"></path>
          <path d="M24,64 C24,42 40,26 60,26 C80,26 96,42 96,64 C86,75 34,75 24,64 Z" fill="#88C0D0"></path>
          <circle cx="93" cy="94" r="13" fill="#E06A74" stroke="#2E3440" stroke-width="3"></circle>
        </svg>
        <span id="line"></span>
      </div>
    </main>
    <script type="module" src="/src/label.ts"></script>
  </body>
</html>
